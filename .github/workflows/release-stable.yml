# Stable tagged releases. Pushing a tag v* builds the installers and puts a
# DRAFT GitHub release up with the update feed files. Nothing becomes public
# automatically: a person reviews the draft and clicks Publish. Installed
# apps on the stable channel then see the release through its update feed.
#
# Requires the tag's version to match package.json (checked in CI).

name: Stable release (tagged, drafted for review)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Build & draft release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: ubuntu-24.04
            args: --linux
          - os: windows-latest
            args: --win

    env:
      DISTRIBUTION_PUBLISH: always
      DISTRIBUTION_CHANNEL: stable
      STABLE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version.replace(/-.*$/, '')")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG. Fix one of them and re-tag."; exit 1
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-dist.js ${{ matrix.args }}

      - name: Upload artifacts (build log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
          if-no-files-found: ignore
          retention-days: 7
