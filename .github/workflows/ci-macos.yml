# Runs the tests and a packaging check on macOS (Apple Silicon) and Linux.
# Named ci-macos.yml so it never overwrites another CI file. It only reads the
# repository: no secrets, no publishing, no uploads of user data.
name: CI (macOS + Linux)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The fixture syllabus PDF is generated by a Python script at test time.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: npm test

      # Boots the real Electron app once and exits. Linux needs a virtual display.
      - name: Smoke boot (macOS)
        if: runner.os == 'macOS'
        run: npm run smoke

      - name: Smoke boot (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- --no-sandbox --disable-gpu

  package:
    name: Package check (macOS, unsigned)
    runs-on: macos-14
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the unpacked app for this machine. It is unsigned on purpose
      # (see the README): this only proves the packaging works.
      - name: Build unpacked app
        run: npm run pack

      - name: Check what was packaged
        run: |
          test -d dist
          ls dist
